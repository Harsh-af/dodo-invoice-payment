services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice"]
      interval: 2s
      timeout: 5s
      retries: 15

  mock-psp:
    build:
      context: .
      dockerfile: mock-psp/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"

  webhook-receiver:
    build:
      context: .
      dockerfile: webhook-receiver/Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"

  invoice-service:
    build:
      context: .
      dockerfile: invoice-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://invoice:invoice@db:5432/invoice
      PSP_BASE_URL: http://mock-psp:8081
      PSP_TIMEOUT_SECS: "5"
      DEMO_API_KEY: dodo_sk_demo_key_for_assignment_only
      RUST_LOG: invoice_service=info
    depends_on:
      db:
        condition: service_healthy
      mock-psp:
        condition: service_started
      webhook-receiver:
        condition: service_started
