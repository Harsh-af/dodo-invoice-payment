[package]
name = "webhook-receiver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "webhook-receiver"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "json"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
