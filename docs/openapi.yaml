openapi: 3.0.3
info:
  title: Dodo Invoice & Payment Service
  version: 0.1.0
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_state
            message:
              type: string
            details:
              type: object
              nullable: true
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
    LineItem:
      type: object
      required: [description, quantity, unit_amount_cents]
      properties:
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_amount_cents: { type: integer, minimum: 0 }
    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        state:
          type: string
          enum: [draft, open, paid, void, uncollectible]
        total_cents: { type: integer }
        due_date: { type: string, format: date }
        line_items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/LineItem'
              - type: object
                properties:
                  line_total_cents: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PayResponse:
      type: object
      properties:
        payment_attempt:
          type: object
          properties:
            id: { type: string, format: uuid }
            invoice_id: { type: string, format: uuid }
            state: { type: string, enum: [pending, succeeded, failed] }
            psp_ref: { type: string, nullable: true }
            failure_code: { type: string, nullable: true }
        invoice:
          $ref: '#/components/schemas/Invoice'
paths:
  /health:
    get:
      security: []
      summary: Health check
      responses:
        '200':
          description: OK
  /customers:
    post:
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string }
      responses:
        '200':
          description: Created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List customers
      responses:
        '200':
          description: Customer list
  /customers/{id}:
    get:
      summary: Get customer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invoices:
    post:
      summary: Create invoice
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, due_date, line_items]
              properties:
                customer_id: { type: string, format: uuid }
                due_date: { type: string, format: date }
                finalize: { type: boolean, default: false }
                line_items:
                  type: array
                  items:
                    $ref: '#/components/schemas/LineItem'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
    get:
      summary: List invoices
      parameters:
        - name: state
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Invoice list
  /invoices/{id}:
    get:
      summary: Get invoice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
  /invoices/{id}/pay:
    post:
      summary: Pay invoice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [card_token]
              properties:
                card_token: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayResponse'
        '202':
          description: Payment pending (PSP timeout)
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/endpoints:
    post:
      summary: Register webhook endpoint
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                secret: { type: string }
      responses:
        '200':
          description: Registered
